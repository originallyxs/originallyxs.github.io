      position: fixed;   
      inset: 0;   
      z-index: 9999;   
      display: flex;   
      flex-direction: column; 
      align-items: center;   
      justify-content: center;   
      transition: opacity 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);   
      background: #ebfbee;   
    }   
    @media (prefers-color-scheme: dark) {   
      #loading-mask {   
        background: #0b6a1e;   
      }   
    }   
    .loading-spinner {   
      width: 40px;   
      height: 40px;   
      border: 3px solid #D3F9d8;   
      border-top-color: #2f9e44;   
      border-radius: 50%;   
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;   
    } 
    .loading-footer { 
      position: absolute; 
      bottom: 40px; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 340px; 
      opacity: 0; 
      transition: opacity 0.7s cubic-bezier(0.25, 0.1, 0.25, 1); 
    } 
    .loading-footer.show { 
      opacity: 1; 
    } 
    @keyframes spin {   
      to { transform: rotate(360deg); }   
    }   
    #loading-mask.fade-out {   
      opacity: 0;   
      pointer-events: none;   
    }
    /* 原页面1：棋盘与棋子自定义样式 */
    @layer utilities {
      .bg-blur-12 {
        filter: blur(12px);
        transform: scale(1.1);
      }
      .chess-cell {
        aspect-ratio: 1 / 1;
      }
      .piece-base {
        width: 80%;
        height: 80%;
        transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        will-change: transform, opacity;
      }
      .piece-base:hover {
        transform: scale(1.1);
      }
      .piece-base:active {
        transform: scale(0.9);
      }
      .piece-captured {
        transform: scale(0) !important;
        opacity: 0 !important;
      }
      .piece-svg {
        width: 70%;
        height: 70%;
        pointer-events: none;
      }
    }

    const tempTo = board[toRow][toCol];
    
    let epCaptured = null;
    let epRow = null;
    if (tempFrom[1] === 'P' && enPassantTarget && 
        toRow === enPassantTarget[0] && toCol === enPassantTarget[1]) {
      epRow = color === 'w' ? toRow + 1 : toRow - 1;
      epCaptured = board[epRow][toCol];
      board[epRow][toCol] = null;
    }
    
    board[toRow][toCol] = tempFrom;
    board[fromRow][fromCol] = null;
    
    const inCheck = isKingInCheck(color);
    
    board[fromRow][fromCol] = tempFrom;
    board[toRow][toCol] = tempTo;
    if (epCaptured) board[epRow][toCol] = epCaptured;
    
    return inCheck;
  }
  function isCheckmate(color) {
    if (!isKingInCheck(color)) return false;
    return !hasAnyLegalMove(color);
  }
  function hasAnyLegalMove(color) {
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = board[r][c];
        if (p && p[0] === color) {
          const moves = getValidMoves(r, c);
          if (moves.length > 0) return true;
        }
      }
    }
    return false;
  }
  function checkGameEnd() {
    const opponent = currentTurn;
    if (isCheckmate(opponent)) {
      gameOver = true;
      const winner = opponent === 'w' ? '黑方' : '白方';
      document.getElementById('game-status').textContent = `将死！${winner}获胜`;
      showToast('CHECKMATE', `${winner} 获胜`, 0);
      return;
    }
    if (!hasAnyLegalMove(opponent)) {
      gameOver = true;
      document.getElementById('game-status').textContent = '逼和！平局';
      showToast('STALEMATE', '逼和 平局', 0);
      return;
    }
    if (halfMoveClock >= 100) {
      gameOver = true;
      document.getElementById('game-status').textContent = '50回合规则 和棋';
      showToast('DRAW', '50回合规则 和棋', 0);
      return;
    }
    document.getElementById('game-status').textContent = '';
  }
  // 简易AI
  function aiMove() {
    if (gameOver || isAnimating) return;
    
    const allMoves = [];
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const p = board[r][c];
        if (p && p[0] === 'b') {
          const moves = getValidMoves(r, c);
          moves.forEach(m => {
            let score = 0;
            if (board[m.row][m.col]) {
              const values = { P:1, N:3, B:3, R:5, Q:9, K:100 };
              score += values[board[m.row][m.col][1]] * 10;
            }
            score += (3.5 - Math.abs(m.row - 3.5)) + (3.5 - Math.abs(m.col - 3.5));
            score += Math.random() * 2;
            allMoves.push({ from: [r,c], to: [m.row, m.col], score });
          });
        }
      }
    }
    
    allMoves.sort((a,b) => b.score - a.score);
    const best = allMoves[0];
    makeMove(best.from[0], best.from[1], best.to[0], best.to[1]);
  }
  // UI状态更新
  function updateStatus() {
    document.getElementById('turn-text').textContent = currentTurn === 'w' ? '白方' : '黑方';
  }
  function renderNotation() {
    const list = document.getElementById('notation-list');
    list.innerHTML = '';
    
    const rounds = {};
    moveHistory.forEach(m => {
      if (!rounds[m.moveNum]) rounds[m.moveNum] = { w: '', b: '' };
      rounds[m.moveNum][m.turn] = m.notation;
    });
    
    Object.keys(rounds).forEach(num => {
      const row = document.createElement('div');
      row.className = 'flex gap-2 border-b border-gray-100 dark:border-gray-700 py-1';
      row.innerHTML = `
        <span class="text-gray-400 w-6">${num}.</span>
        <span class="w-16">${rounds[num].w}</span>
        <span class="w-16">${rounds[num].b}</span>
      `;
      list.appendChild(row);
    });
    
    list.scrollTop = list.scrollHeight;
  }
  // 工具函数
  function isInBoard(row, col) {
    return row >= 0 && row < 8 && col >= 0 && col < 8;
  }
  // 按钮事件绑定
  document.getElementById('btn-pvp').addEventListener('click', () => {
    gameMode = 'pvp';
    document.getElementById('mode-text').textContent = '双人对战';
    document.getElementById('btn-pvp').className = 'px-4 py-2 rounded-lg bg-primary text-white font-medium hover:bg-primary/80 transition-all duration-300 ease-in-out active:scale-95';
    document.getElementById('btn-ai').className = 'px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-300 ease-in-out active:scale-95';
    initGame();
  });
  document.getElementById('btn-ai').addEventListener('click', () => {
    gameMode = 'ai';
    document.getElementById('mode-text').textContent = '人机对战';
    document.getElementById('btn-ai').className = 'px-4 py-2 rounded-lg bg-primary text-white font-medium hover:bg-primary/80 transition-all duration-300 ease-in-out active:scale-95';
    document.getElementById('btn-pvp').className = 'px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-medium hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-300 ease-in-out active:scale-95';
    initGame();
  });
  document.getElementById('btn-reset').addEventListener('click', initGame);
  // 启动游戏
  initGame();
</script>
