       font-weight: normal;    
       font-style: normal;    
       font-display: swap;    
     }    
     @font-face {    
       font-family: 'SerifFont';    
       src: url('./fonts/serifFont.woff2') format('woff2');    
       font-weight: normal;    
       font-style: normal;    
       font-display: swap;    
     }    
     @font-face {

       src: url('./fonts/codeFont.woff2') format('woff2');    
       font-weight: normal;    
       font-style: normal;    
       font-display: swap;    
     }

       font-weight: normal;    
       font-style: normal;    
       font-display: swap;

     * {

     }    
     html, body {    
       overflow: hidden;    
       touch-action: none;    
       height: 100%;    
       margin: 0;    
       background-size: cover;    
       background-position: center;    
       background-attachment: fixed;    
       min-height: 100vh;    
     }    
     .serif, blockquote,h1,h2,h3,h4,h5,h6 {    
       font-family: 'SerifFont', serif !important;    
     }    
     code, pre {    
       font-family: 'CodeFont', monospace !important;    
       font-style: normal !important;    
     }    
     code em, code i, pre em, pre i {    
       font-family: 'CodeFontItalic', monospace !important;    
       font-style: normal !important;    
     }    
     #loading-mask {    
       position: fixed;    
       inset: 0;    
       z-index: 9999;    
       display: flex;    
       flex-direction: column;  
       align-items: center;    
       justify-content: center;    
       transition: opacity 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);    
       background: #ebfbee;    
     }    
     @media (prefers-color-scheme: dark) {    
       #loading-mask {    
         background: #0b6a1e;    
       }    
     }    
     .loading-spinner {    
       width: 40px;    
       height: 40px;    
       border: 3px solid #D3F9d8;    
       border-top-color: #2f9e44;    
       border-radius: 50%;    
       animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;    
     }  
     .loading-footer {  
       position: absolute;  
       bottom: 40px;  
       left: 50%;  
       transform: translateX(-50%);  
       width: 340px;  
       opacity: 0;  
       transition: opacity 0.7s cubic-bezier(0.25, 0.25, 1);  
     }  
     .loading-footer.show {  
       opacity: 1;  
     }  
     @keyframes spin {    
       to { transform: rotate(360deg); }    
     }    
     #loading-mask.fade-out {    
       opacity: 0;    
       pointer-events: none;    
     } 
     </style>

     <script> 
       tailwind.config = {    
       darkMode: 'media',    
       theme: {    
         colors: {    
           green: {50:'#EBFBEE',100:'#D3F9D8',200:'#B2F2BB',300:'#8CE99A',400:'#69DB7C',500:'#51CF66',600:'#40C057',700:'#37B24D',800:'#2F9E44',900:'#2B8A3E'},    
           white: '#fff', black: '#000', transparent: 'transparent'    
         }    
       }    
     }  
     let footerImageLoaded = false;  
     function checkFooterImageLoaded() {  
       if(!footerImageLoaded) {  
         footerImageLoaded = true;  
         document.getElementById('loadingFooter').classList.add('show');  
       }  
     }  
     window.addEventListener('load', function () {    
       setTimeout(() => {    
         const mask = document.getElementById('loading-mask');    
         mask.classList.add('fade-out');    
         setTimeout(() => mask.remove(), 800);    
       }, 200);    
     });

     // 智能判断：网址跳转，文字搜索
     function isUrl(text) {
       // 匹配带http/https的网址
       const urlRegex = /^(https?:\/\/)/i;
       // 匹配域名格式（如baidu.com）
       const domainRegex = /^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$/;
       return urlRegex.test(text) || domainRegex.test(text);
     }

     function handleSearch() {    
       const btn = document.getElementById('searchButton');    
       const text = document.getElementById('searchBtnTxt');    
       const searchIcon = document.getElementById('searchIcon');    
       const loadIcon = document.getElementById('loadIcon');    
       const successIcon = document.getElementById('successIcon');    
       const searchInput = document.getElementById('searchInput'); 
       const inputValue = searchInput.value.trim();

       if (!inputValue) { 
         alert('请输入文本'); 
         return; 
       }

       btn.disabled = true;    
       btn.classList.add('opacity-70', 'cursor-not-allowed');    
       searchIcon.classList.add('hidden');    
       successIcon.classList.add('hidden');    
       loadIcon.classList.remove('hidden');    
       text.textContent = '处理中...';

       setTimeout(() => {
         let targetUrl;
         // 判断是否为网址
         if (isUrl(inputValue)) {
           // 网址：自动补全https并跳转
           targetUrl = inputValue.startsWith('http') ? inputValue : 'https://' + inputValue;
         } else {
           // 非网址：必应搜索
           targetUrl = `https://cn.bing.com/search?q=${encodeURIComponent(inputValue)}`;
         }
         window.open(targetUrl, '_blank');

         loadIcon.classList.add('hidden');    
         successIcon.classList.remove('hidden');    
         text.textContent = '成功';
         
         setTimeout(() => {    
           successIcon.classList.add('hidden');    
           searchIcon.classList.remove('hidden');    
           btn.disabled = false;    
           btn.classList.remove('opacity-70', 'cursor-not-allowed');    
           text.textContent = '跳转';    
         }, 1000);    
       }, 1000);    
     }

     // 回车触发
     document.getElementById('searchInput').addEventListener('keydown', function(e) { 
       if (e.key === 'Enter') { 
         handleSearch(); 
       } 
     }); 
     </script>
