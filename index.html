<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>网站更新中</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      overflow: hidden;
      touch-action: none;
      height: 100%;
    }
    body {
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
      position: relative;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="bg-[url('./dark_backdrop.jpg')] flex items-center justify-center p-4">

  <!-- 圆角模糊窗口 -->
  <div class="rounded-[12px] backdrop-blur-[6px] bg-black/40 px-10 py-8 shadow-xl flex flex-col items-center gap-6">
    <h2 class="text-[clamp(1.5rem,4vw,2.2rem)] text-white font-medium text-center">
      网站正在更新中
    </h2>

    <!-- 按钮：使用你提供的加载和成功SVG，图标在文字左侧 -->
    <button 
      id="催更按钮"
      onclick="handle催更()"
      class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition-all text-white px-6 py-3 rounded-lg font-medium flex items-center gap-2"
    >
      <!-- 你提供的加载图标 -->
      <svg id="加载图标" class="w-5 h-5 text-white animate-spin hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <title>loading_3_line</title>
        <g id="loading_3_line" fill="none" fill-rule="evenodd">
          <path d="M24 0v24H0V0zM12.593 23.258l-.011.002-.071.035-.02.004-.014-.004-.071-.035c-.01-.004-.019-.001-.024.005l-.004.01-.017.428.005.02.01.013.104.074.015.004.012-.004.104-.074.012-.016.004-.017-.017-.427c-.002-.01-.009-.017-.017-.018m.265-.113-.013.002-.185.093-.01.01-.003.011.018.43.005.012.008.007.201.093c.012.004.023 0 .029-.008l.004-.014-.034-.614c-.003-.012-.01-.02-.02-.022m-.715.002a.023.023 0 0 0-.027.006l-.006.014-.034.614c0 .012.007.02.017.024l.015-.002.201-.093.01-.008.004-.011.017-.43-.003-.012-.01-.01z"/>
          <path fill="currentColor" d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10S2 17.523 2 12" opacity=".25"/>
          <path fill="currentColor" d="M12 4a7.958 7.958 0 0 0-5.533 2.222 1 1 0 1 1-1.384-1.444A9.958 9.958 0 0 1 12 2a1 1 0 1 1 0 2"/>
        </g>
      </svg>
      <!-- 你提供的成功图标 -->
      <svg id="成功图标" class="w-5 h-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <title>check_circle_line</title>
        <g id="check_circle_line" fill="none">
          <path d="M24 0v24H0V0zM12.593 23.258l-.011.002-.071.035-.02.004-.014-.004-.071-.035c-.01-.004-.019-.001-.024.005l-.004.01-.017.428.005.02.01.013.104.074.015.004.012-.004.104-.074.012-.016.004-.017-.017-.427c-.002-.01-.009-.017-.017-.018m.265-.113-.013.002-.185.093-.01.01-.003.011.018.43.005.012.008.007.201.093c.012.004.023 0 .029-.008l.004-.014-.034-.614c-.003-.012-.01-.02-.02-.022m-.715.002a.023.023 0 0 0-.027.006l-.006.014-.034.614c0 .012.007.02.017.024l.015-.002.201-.093.01-.008.004-.011.017-.43-.003-.012-.01-.01z"/>
          <path fill="currentColor" d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2m0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16m3.535 4.381a1 1 0 0 1 1.498 1.32l-.083.094-5.586 5.587a1.1 1.1 0 0 1-1.46.085l-.096-.085-2.758-2.758a1 1 0 0 1 1.32-1.498l.094.084 2.122 2.121 4.95-4.95Z"/>
        </g>
      </svg>
      <span id="按钮文本">点击催更</span>
    </button>
  </div>

  <!-- 底部模糊版权栏 -->
  <div class="fixed bottom-0 left-0 right-0 backdrop-blur-[6px] bg-black/30 py-3 text-center text-gray-200 text-sm">
    <div class="mb-1">Copyright &copy; 2024-2026 OriginallyX Coalition Studio. All rights reserved.</div>
    <div>Made with ❤️ in China. 在中国，用 ❤️ 制作。</div>
  </div>

  <script>
    function handle催更() {
      const btn = document.getElementById('催更按钮');
      const text = document.getElementById('按钮文本');
      const loading = document.getElementById('加载图标');
      const success = document.getElementById('成功图标');

      // 加载状态
      btn.disabled = true;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      loading.classList.remove('hidden');
      success.classList.add('hidden');
      text.textContent = '正在催更...';

      // 2秒后显示成功
      setTimeout(() => {
        loading.classList.add('hidden');
        success.classList.remove('hidden');
        text.textContent = '催更成功';

        // 1秒后恢复
        setTimeout(() => {
          btn.disabled = false;
          btn.classList.remove('opacity-70', 'cursor-not-allowed');
          loading.classList.add('hidden');
          success.classList.add('hidden');
          text.textContent = '点击催更';
        }, 1000);
      }, 2000);
    }
  </script>
</body>
</html>
