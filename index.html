<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网站更新中</title>
  <!-- 正确的 Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
    }
  </style>
</head>
<body class="bg-[url('./light_backdrop.jpg')] dark:bg-[url('./dark_backdrop.jpg')] flex items-center justify-center p-4">

  <!-- 圆角12 模糊6 窗口 -->
  <div class="rounded-[12px] backdrop-blur-[6px] bg-white/30 dark:bg-black/40 px-10 py-8 shadow-xl flex flex-col items-center gap-6">
    <h2 class="text-[clamp(1.5rem,4vw,2.2rem)] text-gray-800 dark:text-white font-medium text-center">
      网站正在更新中<br>
      <span class="animate-pulse">...</span>
    </h2>

    <!-- 催更按钮：绿色系，和背景更协调，有按压效果，不发请求 -->
    <button 
      onclick="alert('催更成功～')"
      class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition-all text-white px-6 py-3 rounded-lg font-medium"
    >
      点击加速催更
    </button>
  </div>

</body>
</html>
