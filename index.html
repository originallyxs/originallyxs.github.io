    @font-face {   
      font-family: 'CurrentFont';   
      src: url('https://cdn.originallyxs.cc.cd/defaultfont/defaultFont-Regular.woff2') format('woff2');   
      font-weight: normal;   
      font-style: normal;   
      font-display: swap;   
    }   
    @font-face {   
      font-family: 'SerifFont';   
      src: url('https://cdn.originallyxs.cc.cd/defaultfont/defaultFont-Bold.woff2') format('woff2');   
      font-weight: normal;   
      font-style: normal;   
      font-display: swap;   
    }   
    @font-face {   
      font-family: 'CodeFont';   
      src: url('./fonts/codeFont.woff2') format('woff2');   
      font-weight: normal;   
      font-style: normal;   
      font-display: swap;   
    }   
    @font-face {   
      font-family: 'CodeFontItalic';   
      src: url('./fonts/codeFontItalic.woff2') format('woff2');   
      font-weight: normal;   
      font-style: normal;   
      font-display: swap;   
    }   
    * {   
      font-family: 'CurrentFont', sans-serif !important;   
    }   
    html, body {   
      overflow: hidden;   
      touch-action: none;   
      height: 100%;   
      margin: 0;   
      background-size: cover;   
      background-position: center;   
      background-attachment: fixed;   
      min-height: 100vh;   
    }   
    .serif, blockquote,h1,h2,h3,h4,h5,h6 {   
      font-family: 'SerifFont', serif !important;   
    }   
    code, pre {   
      font-family: 'CodeFont', monospace !important;   
      font-style: normal !important;   
    }   
    code em, code i, pre em, pre i {   
      font-family: 'CodeFontItalic', monospace !important;   
      font-style: normal !important;   
    }   
    #loading-mask {   
      position: fixed;   
      inset: 0;   
      z-index: 9999;   
      display: flex;   
      flex-direction: column; 
      align-items: center;   
      justify-content: center;   
      transition: opacity 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);   
      background: #c5cae9;   
    }   
    @media (prefers-color-scheme: dark) {   
      #loading-mask {   
        background: #1a237e;   
      }   
    }   
    .loading-spinner {   
      width: 40px;   
      height: 40px;   
      border: 3px solid #9fa8da;   
      border-top-color: #283593;   
      border-radius: 50%;   
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;   
    } 
    .loading-footer { 
      position: absolute; 
      bottom: 40px; 
      left: 50%; 
      transform: translateX(-50%); 
      width: 340px; 
      opacity: 0; 
      transition: opacity 0.7s cubic-bezier(0.25, 0.1, 0.25, 1); 
    } 
    .loading-footer.show { 
      opacity: 1; 
    } 
    @keyframes spin {   
      to { transform: rotate(360deg); }   
    }   
    #loading-mask.fade-out {   
      opacity: 0;   
      pointer-events: none;   
    }
    /* 全局a标签hover/active颜色 */
    a {
      transition: color 0.2s ease;
    }
    a:hover {
      color: #5C6BC0 !important; /* indigo‑400 */
    }
    a:active {
      color: #3949AB !important; /* indigo‑600 */
    }
  </style>

  <script>
    tailwind.config = {   
      darkMode: 'media',   
      theme: {
        colors: {   
          indigo: {
            50: '#E8EAF6',
            100: '#C5CAE9',
            200: '#9FA8DA',
            300: '#7986CB',
            400: '#5C6BC0',
            500: '#3F51B5',
            600: '#3949AB',
            700: '#303F9F',
            800: '#283593',
            900: '#1A237E',
          },   
          white: '#fff', 
          black: '#000', 
          transparent: 'transparent'
        }
      }   
    } 

    let footerImageLoaded = false; 
    function checkFooterImageLoaded() { 
      if(!footerImageLoaded) { 
        footerImageLoaded = true; 
        document.getElementById('loadingFooter').classList.add('show'); 
      } 
    } 

    window.addEventListener('load', function () {   
      setTimeout(() => {   
        const mask = document.getElementById('loading-mask');   
        mask.classList.add('fade-out');   
        setTimeout(() => mask.remove(), 800);   
      }, 200);   
    });   

  </script>
