<!DOCTYPE html> 
<html lang="zh-CN">     
<head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">    
    <title>原炀联盟工作室</title>    
    <script src="https://cdn.tailwindcss.com"></script>    
    <!-- 签名必需的CryptoJS，提前引入 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  
    <style>    
      @font-face {    
        font-family: 'CurrentFont';    
        src: url('./fonts/currentFont.woff2') format('woff2');    
        font-weight: normal;    
        font-style: normal;    
        font-display: swap;    
      }    
      @font-face {    
        font-family: 'SerifFont';    
        src: url('./fonts/serifFont.woff2') format('woff2');    
        font-weight: normal;    
        font-style: normal;    
        font-display: swap;    
      }    
      @font-face {    
        font-family: 'CodeFont';    
        src: url('./fonts/codeFont.woff2') format('woff2');    
        font-weight: normal;    
        font-style: normal;    
        font-display: swap;    
      }    
      @font-face {    
        font-family: 'CodeFontItalic';    
        src: url('./fonts/codeFontItalic.woff2') format('woff2');    
        font-weight: normal;    
        font-style: normal;    
        font-display: swap;    
      }    
      * {    
        font-family: 'CurrentFont', sans-serif !important;    
      }    
      html, body {    
        overflow: auto; /* 取消隐藏滚动，避免内容溢出 */
        touch-action: auto;
        height: 100%;    
        margin: 0;    
        background-size: cover;    
        background-position: center;    
        background-attachment: fixed;    
        min-height: 100vh;    
      }    
      .serif, blockquote,h1,h2,h3,h4,h5,h6 {    
        font-family: 'SerifFont', serif !important;    
      }    
      code, pre {    
        font-family: 'CodeFont', monospace !important;    
        font-style: normal !important;    
      }    
      code em, code i, pre em, pre i {    
        font-family: 'CodeFontItalic', monospace !important;    
        font-style: normal !important;    
      }    
      #loading-mask {    
        position: fixed;    
        inset: 0;    
        z-index: 9999;    
        display: flex;    
        flex-direction: column;  
        align-items: center;    
        justify-content: center;    
        transition: opacity 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);    
        background: #ebfbee;    
      }    
      @media (prefers-color-scheme: dark) {    
        #loading-mask {    
          background: #0b6a1e;    
        }    
      }    
      .loading-spinner {    
        width: 40px;    
        height: 40px;    
        border: 3px solid #D3F9d8;    
        border-top-color: #2f9e44;    
        border-radius: 50%;    
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;    
      }  
      .loading-footer {  
        position: absolute;  
        bottom: 40px;  
        left: 50%;  
        transform: translateX(-50%);  
        width: 340px;  
        opacity: 0;  
        transition: opacity 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);  
        text-align: center;
        color: #2f9e44;
        dark-color: #D3F9d8;
        font-size: 14px;
      }  
      .loading-footer.show {  
        opacity: 1; /* 强制显示 */
      }  
      /* 图片加载失败时显示文字兜底 */
      .loading-footer img {
        display: block;
        width: 100%;
        height: auto;
        margin: 0 auto;
      }
      @keyframes spin {    
        to { transform: rotate(360deg); }    
      }    
      #loading-mask.fade-out {    
        opacity: 0;    
        pointer-events: none;    
      }    
    </style>    
</head>    
  
<body class="bg-[url('./pictures/light_backdrop.jpg')] dark:bg-[url('./pictures/dark_backdrop.jpg')] text-gray-900 dark:text-white flex items-center justify-center p-4">    
    <!-- 加载遮罩：保留原有结构，Footer加文字兜底 -->
    <div id="loading-mask">    
      <div class="loading-spinner"></div>  
      <div class="loading-footer" id="loadingFooter">  
        <!-- 图片+文字双兜底，图片错了显示文字 -->
        <img src="./pictures/index/light_footer.png" class="block dark:hidden" alt="首次加载可能较慢，请耐心等待">  
        <img src="./pictures/index/dark_footer.png" class="hidden dark:block" alt="首次加载可能较慢，请耐心等待">  
        <span class="block mt-2 dark:text-D3F9d8">首次加载可能较慢，请耐心等待</span>
      </div>  
    </div>    
  
    <div class="rounded-[12px] backdrop-blur-[6px] bg-white/40 dark:bg-black/40 px-10 py-8 shadow-xl flex flex-col items-center gap-6 mt-[-60px]">    
      <h2 class="text-[clamp(1.5rem,4vw,2.2rem)] font-medium text-center">网站正在更新中</h2>  

      <!-- 浏览量+催更数 统计模块 | 适配原有样式 -->
      <div class="flex gap-8 text-[clamp(1rem,3vw,1.3rem)] text-gray-700 dark:text-gray-200">
        <div>浏览量：<span id="view-count" class="font-semibold text-emerald-600 dark:text-emerald-400">0</span></div>
        <div>催更数：<span id="urge-count" class="font-semibold text-emerald-600 dark:text-emerald-400">0</span></div>
      </div>

      <!-- 补全按钮 | 贴合原有绿色调 -->
      <button id="remindButton" class="px-8 py-3 rounded-lg bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-medium transition-all shadow-md hover:shadow-lg">
        更新提醒我
      </button>
      <button id="urge-btn" class="px-8 py-3 rounded-lg bg-emerald-600/80 hover:bg-emerald-700/80 active:bg-emerald-800/80 text-white font-medium transition-all shadow-md hover:shadow-lg">
        点击催更
      </button>
    </div>  

    <script>
      // ========== 第一步：优先执行【加载遮罩+Footer】逻辑，100%生效 ==========
      // 不等待任何其他代码，DOM一加载就执行
      window.onload = function() {
        const loadingMask = document.getElementById('loading-mask');
        const loadingFooter = document.getElementById('loadingFooter');
        
        // 强制显示Footer：300ms就触发，比之前更早
        if (loadingFooter) {
          setTimeout(() => {
            loadingFooter.classList.add('show');
          }, 300);
        }

        // 1.5秒后强制隐藏遮罩，足够看加载动画+Footer
        if (loadingMask) {
          setTimeout(() => {
            loadingMask.classList.add('fade-out');
          }, 1500);
        }

        // 更新提醒按钮点击事件
        const remindBtn = document.getElementById('remindButton');
        if (remindBtn) {
          remindBtn.addEventListener('click', () => {
            alert('已为你记录更新提醒，网站更新后会第一时间通知～');
          });
        }
      };

      // ========== 第二步：统计逻辑【后台执行】，不影响页面任何显示 ==========
      (function(window, CryptoJS) {
        // 双层容错：依赖缺失/域名不对，直接退出，不报错
        if (!CryptoJS || !CryptoJS.SHA256) return;
        const currentDomain = window.location.hostname;
        if (!currentDomain.includes('originallyxs.cc.cd')) return;
        
        'use strict';
        // 核心配置（无需修改）
        const CORE_CONFIG = {
          readOnly: false,
          signSalt: '',
          token: 'o15DuJZVFCAtJbeqAqR8LRsvIe8q4tOcYMWbBjYAqoGtcGOPsUhHntQj1wgF659gGZnu18JQRukI5WaXdtPpnpVJu7f765a297ccsbniijh40W44trLgzc372135LiINuU59119d682f11354nRatUVda790=',
          uid: '11860',
          tableId: '7e79ec6b834a97a4528d5a9fc44f84c1',
          baseUrl: 'https://dbs.pgaot.com',
          currentPage: 'index.html',
          field: { pageKey: 'Page_Mingcheng', viewCount: 'IndexLiulanCishu', urgeCount: 'Handle_CuigengCishu' },
          rateLimit: { select: 200, view: 600000, urge: 10000 }
        };

        // 初始化基础变量
        const SHA256 = CryptoJS.SHA256;
        const lastRequestTime = { select: 0, view: 0, urge: 0 };
        const STORAGE_KEY = 'dbs_page_stat_' + CORE_CONFIG.tableId;
        // 获取统计DOM元素，容错
        const viewCountDom = document.getElementById('view-count') || { innerText: 0 };
        const urgeCountDom = document.getElementById('urge-count') || { innerText: 0 };
        const urgeBtn = document.getElementById('urge-btn') || { disabled: false, innerText: '点击催更' };

        // 1. 生成签名（1:1还原源文件逻辑）
        function generateSign(apiPath, params) {
          return SHA256(CORE_CONFIG.uid + apiPath + JSON.stringify(params) + CORE_CONFIG.token)
            .toString(CryptoJS.enc.Hex);
        }

        // 2. 通用接口请求（带容错，报错不阻塞）
        async function requestDbs(apiName, params = {}) {
          try {
            const now = Date.now();
            if (now - lastRequestTime.select < CORE_CONFIG.rateLimit.select) return null;
            lastRequestTime.select = now;

            const apiPath = `/api/${apiName}`;
            const fullParams = { 
              ...params, 
              uid: CORE_CONFIG.uid, 
              tableid: CORE_CONFIG.tableId, 
              page_url: window.location.href, 
              timestamp: now 
            };

            const res = await fetch(`${CORE_CONFIG.baseUrl}${apiPath}`, {
              method: 'POST',
              headers: { 
                'Content-Type': 'application/json', 
                'Authorization': `Bearer ${CORE_CONFIG.token}`, 
                'pgsign': generateSign(apiPath, fullParams) 
              },
              body: JSON.stringify(fullParams),
              cache: 'no-store'
            });
            const result = await res.json();
            return result.code === 0 ? result : null;
          } catch (err) {
            console.log('【统计小提示】', err.message);
            return null;
          }
        }

        // 3. 统计核心API
        const DbsStatApi = {
          // 查询数据
          async getPageData() {
            const res = await requestDbs('get_table_data', { 
              filter: `${CORE_CONFIG.field.pageKey}='${CORE_CONFIG.currentPage}'`, 
              limit: 1 
            });
            return res?.data?.[0] || { 
              [CORE_CONFIG.field.viewCount]: 0, 
              [CORE_CONFIG.field.urgeCount]: 0 
            };
          },
          // 浏览量自增
          async addViewCount() {
            if (CORE_CONFIG.readOnly) return;
            const storageData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            const now = Date.now();
            // 防重复统计
            if (now - (storageData[`view_${CORE_CONFIG.currentPage}`] || 0) < CORE_CONFIG.rateLimit.view) return;
            if (now - lastRequestTime.view < CORE_CONFIG.rateLimit.view) return;
            lastRequestTime.view = now;

            const res = await requestDbs('set_table_data', {
              type: 'UPDATE',
              fields: `${CORE_CONFIG.field.viewCount}=${CORE_CONFIG.field.viewCount}+1`,
              filter: `${CORE_CONFIG.field.pageKey}='${CORE_CONFIG.currentPage}'`
            });
            // 更新本地存储
            if (res) {
              storageData[`view_${CORE_CONFIG.currentPage}`] = now;
              localStorage.setItem(STORAGE_KEY, JSON.stringify(storageData));
            }
          },
          // 催更数自增
          async addUrgeCount() {
            if (CORE_CONFIG.readOnly) return;
            const now = Date.now();
            if (now - lastRequestTime.urge < CORE_CONFIG.rateLimit.urge) return;
            lastRequestTime.urge = now;

            return await requestDbs('set_table_data', {
              type: 'UPDATE',
              fields: `${CORE_CONFIG.field.urgeCount}=${CORE_CONFIG.field.urgeCount}+1`,
              filter: `${CORE_CONFIG.field.pageKey}='${CORE_CONFIG.currentPage}'`
            });
          }
        };

        // 4. 初始化统计：页面加载后自动执行
        async function initStat() {
          // 先查数据渲染
          const pageData = await DbsStatApi.getPageData();
          viewCountDom.innerText = pageData[CORE_CONFIG.field.viewCount];
          urgeCountDom.innerText = pageData[CORE_CONFIG.field.urgeCount];
          // 再更浏览量（后台执行）
          await DbsStatApi.addViewCount();
          // 刷新最新数据
          const newData = await DbsStatApi.getPageData();
          viewCountDom.innerText = newData[CORE_CONFIG.field.viewCount];
        }

        // 5. 绑定催更按钮事件
        urgeBtn.addEventListener('click', async () => {
          urgeBtn.disabled = true;
          urgeBtn.innerText = '催更中...';
          try {
            await DbsStatApi.addUrgeCount();
            const newData = await DbsStatApi.getPageData();
            urgeCountDom.innerText = newData[CORE_CONFIG.field.urgeCount];
            urgeBtn.innerText = '催更成功！';
          } catch (err) {
            urgeBtn.innerText = '催更失败，稍后再试';
          } finally {
            // 无论成败，10秒后恢复按钮
            setTimeout(() => {
              urgeBtn.disabled = false;
              urgeBtn.innerText = '点击催更';
            }, CORE_CONFIG.rateLimit.urge);
          }
        });

        // 启动统计（后台执行）
        initStat();
      })(window, window.CryptoJS);
    </script>
</body>    
</html>
